{% comment %}
  Uso: {% include moon.html category=post.category %}
  Cada categoria de post tem uma fase da lua associada:
    projeto  -> crescente (algo em construção)
    pesquisa -> cheia (algo explorado a fundo)
    anotacao -> nova (um pensamento breve)
{% endcomment %}
{% case include.category %}
  {% when "projeto" %}
    <span class="moon moon--projeto" title="projeto">🌘</span>
  {% when "pesquisa" %}
    <span class="moon moon--pesquisa" title="pesquisa">🌕</span>
  {% when "anotacao" %}
    <span class="moon moon--anotacao" title="anotação">🌑</span>
  {% else %}
    <span class="moon" title="post">🌙</span>
{% endcase %}
